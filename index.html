    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is khadi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cloth whose thread is spun by hand and woven on a handloom. No stage is mechanised. The slight irregularity is not a flaw. It is the signature."
            }
          },
          {
            "@type": "Question",
            "name": "How is Rangvanat different from a khadi store?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A khadi store sells cloth. Rangvanat designs garments as edits. Each piece begins with a story and ends in a seam."
            }
          },
          {
            "@type": "Question",
            "name": "Can I buy a piece?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, by enquiry, not cart. Write to hello@rangvanat.com or use the Enquire button. Edits are made in small numbers, and each begins with a conversation."
            }
          },
          {
            "@type": "Question",
            "name": "Where do you ship?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Anywhere a courier reaches. Timings and duties are confirmed during enquiry."
            }
          },
          {
            "@type": "Question",
            "name": "How are the artisans paid?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Directly, per piece, at rates set with the collective, not against a factory clock."
            }
          },
          {
            "@type": "Question",
            "name": "What do I get as a custodian?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "One letter when a story is ready. New edits, artisan profiles, process notes. No promotions. Unsubscribing stays one click."
            }
          }
        ]
