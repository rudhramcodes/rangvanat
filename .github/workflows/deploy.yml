name: Rangvanat CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: 1

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Set up Node.js
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: npm ci

      # ============================================================
      # 4. Build the Vite React project
      # ============================================================
      - name: Build Vite
        run: npm run build

      # ============================================================
      # 5. Deploy to Hostinger via FTP
      # ============================================================
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          passive: true
          timeout: 120000
          local-dir: ./dist/
          server-dir: /public_html/
          # dangerous-clean-slate: true  # Commented out for safety
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/*

      # ============================================================
      # 6. Optional: Verify deployment
      # ============================================================
      - name: ✅ Verify deployment
        run: echo "Rangvanat deployed successfully to Hostinger!"